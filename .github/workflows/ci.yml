name: CI

on:
  push:
    branches: [main]
  pull_request:

# A newer push to the same branch makes the running check obsolete.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v5
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm lint
      - run: pnpm test
      # A broken import only shows up in the bundle, not in tsc. The bundle is committed, because an installed
      # plugin runs no build, so it must match the source it was built from.
      - run: pnpm build
      - name: Committed bundle matches the source
        run: git diff --exit-code -- dist/ || { echo "::error::dist/ is stale: run pnpm build and commit it"; exit 1; }
