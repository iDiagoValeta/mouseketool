name: release-please

on:
  push:
    branches: [main]

permissions:
  contents: write
  pull-requests: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: googleapis/release-please-action@v5
        with:
          # No release-type here: it would make the action ignore the config file, and with it the
          # extra-files entry that bumps .claude-plugin/plugin.json. The config file sets release-type.
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json
