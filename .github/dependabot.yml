version: 2
updates:
  # GitHub Actions is on by default: it is cheap and avoids keeping
  # unpatched actions around. To add an ecosystem, copy the block and change
  # package-ecosystem and directory: npm "/", pip "/", docker "/", cargo "/", etc.
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    labels:
      - "kind/dependency"
    commit-message:
      # ci(deps): ... does not trigger a release on its own.
      prefix: "ci"
    open-pull-requests-limit: 5
  # pnpm lockfiles are handled by the npm ecosystem.
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
    labels:
      - "kind/dependency"
    commit-message:
      prefix: "chore"
    open-pull-requests-limit: 5
    # A version younger than 72 hours fails `pnpm install` where pnpm's minimumReleaseAge is 4320 minutes, and a
    # bump opened about 52 hours after its release (#68) shows days are not counted to the hour; 4 days clears
    # 72 hours however they are counted. Security updates ignore cooldown and still arrive at once.
    cooldown:
      default-days: 4
